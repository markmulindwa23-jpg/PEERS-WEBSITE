/* Premium navigation animation */
header{isolation:isolate;box-shadow:0 5px 22px #071b1220;transition:box-shadow .3s ease}

b.innerHTML=`<span class="edt">Approved editing mode: click text to edit it, click a photo to replace it (Alt+click removes it). <span id="eds" class="${DIRTY?'edu':''}">${DIRTY?'Unsaved changes':'All changes saved'}</span></span><span class="edb"><button data-ea="photos" title="Go to the Gallery to add many photos at once">📷 Add photos</button><button data-ea="sec">+ Homepage section</button><button data-ea="page">+ New page</button><button data-ea="save">Save</button><button data-ea="pub" title="Download a ready-to-host copy of the site">Export site</button><button data-ea="disc" title="Discard every unsaved change on the website">Discard all</button><button data-ea="exit">Exit</button></span>`}
function edStart(){if(!edAuth())return;ES=cl(D);EBASE=new WeakMap();EDIT=true;DIRTY=false;if(location.hash=='#admin')location.hash='home';else render()}
function edSave(){if(Store.save(D)){Media.gc();ES=cl(D);EBASE=new WeakMap();DIRTY=false;theme();edStat('Saved');setTimeout(()=>edStat(),2500);return true}alert('Could not save: browser storage is full. Remove very large photos or export a backup from the admin panel.');return false}
function edExit(){if(DIRTY){if(confirm('Save your changes before leaving edit mode?')){if(!edSave())return}else if(confirm('Leave without saving? Your changes will be lost.')){D=cl(ES)}else return}EDIT=false;DIRTY=false;render()}
function edAct(a){
if(a=='start')return edStart();
if(a=='save')return edSave();
if(a=='photos'){if((location.hash.slice(1)||'home')=='gallery'){const u=document.querySelector('#gdrop [data-gup]');if(u)u.scrollIntoView({block:'center',behavior:'smooth'})}else location.hash='gallery';return}
if(a=='pub')return exportSite();
if(a=='exit')return edExit();
if(a=='disc'){if(!DIRTY||confirm('Discard ALL unsaved changes across the whole website?')){D=cl(ES);DIRTY=false;EBASE=new WeakMap();edRedraw()}return}
if(a=='sec'){const s=D.home.sections,i=s.findIndex(x=>x.id=='cta'),id='extra-'+Date.now().toString(36);s.splice(i<0?s.length:i,0,{id,show:'yes',title:'[EDIT: section title]',body:'[EDIT: section text]',img:''});DIRTY=true;
const go=()=>{const e=document.querySelector('[data-sec="'+id+'"]');if(e)e.scrollIntoView({block:'center'})};
if((location.hash.slice(1)||'home')=='home'){render();setTimeout(go,60)}else{location.hash='home';setTimeout(go,150)}return}
if(a=='page'){const t=(prompt('Name of the new page (it will be added to the menu):')||'').trim();if(!t)return;let b=t.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'page',s=b,n=2;
const used=x=>Object.keys(V).includes(x)||['admin','privacy','terms','search'].includes(x)||D.custom.some(c=>c.slug==x)||x.startsWith('branch-');while(used(s))s=b+'-'+n++;
D.custom.push({inMenu:'yes',slug:s,title:t,body:'[EDIT: write this page here]'});DIRTY=true;location.hash=s}}
function edBlank(o){const n=cl(o);(function z(x){for(const k in x){if(x[k]&&typeof x[k]=='object')z(x[k]);else if(typeof x[k]=='string'){if(IMGK.test(k))x[k]='';else if(!NOTAG.test(k))x[k]='[EDIT: new]'}}})(n);if('id' in n&&String(n.id).startsWith('extra'))n.id='extra-'+Date.now().toString(36);return n}
function edItem(b){const r=EDITM[+b.dataset.it];if(!r)return;const a=r.arr,i=a.indexOf(r.it),k=b.dataset.ic;if(i<0)return;
if(k=='rst'){if(!confirm('Discard only the unsaved changes in this section?'))return;edRestoreItem(r.it,EBASE.get(r.it));edDirty();edRedraw();return}
if(k=='del'){if(!confirm('Remove this item from the site?'))return;a.splice(i,1)}
else if(k=='up'){if(i<1)return;[a[i-1],a[i]]=[a[i],a[i-1]]}
else if(k=='dn'){if(i>=a.length-1)return;[a[i+1],a[i]]=[a[i],a[i+1]]}
else if(k=='dup'){const c=cl(r.it);if('id' in c&&String(c.id).startsWith('extra'))c.id='extra-'+Date.now().toString(36);a.splice(i+1,0,c)}
else if(k=='add'){a.splice(i+1,0,edBlank(r.it))}
edDirty();edRedraw()}
function edPick(id,remove){const r=IOR[+id];if(!r)return;
if(remove){if(r.o[r.k]&&confirm('Remove this photo?')){r.o[r.k]='';edDirty();edRedraw()}return}
const f=document.createElement('input');f.type='file';f.accept='image/*';f.onchange=()=>{if(f.files[0])putImage(f.files[0]).then(u=>{r.o[r.k]=u;edDirty();edRedraw()})};f.click()}
function edPost(){const on=edOn();document.body.classList.toggle('ed',on);edBar();if(!on)return;EDITM=[];
const roots=['pv','lg','nav','app','ft'].map($).filter(Boolean);
roots.forEach(r=>r.querySelectorAll('*').forEach(el=>{for(const n of el.getAttributeNames()){const v=el.getAttribute(n);if(v&&HAS.test(v))el.setAttribute(n,v.replace(MK,''))}}));
roots.forEach(r=>{const w=document.createTreeWalker(r,NodeFilter.SHOW_TEXT),ns=[];while(w.nextNode())if(HAS.test(w.currentNode.nodeValue))ns.push(w.currentNode);
ns.forEach(n=>{const tx=n.nodeValue,pe=n.parentElement;if(!pe||pe.closest(NOEP)){n.nodeValue=tx.replace(MK,'');return}
const rx=/\uE000(\d+)\uE001([\s\S]*?)\uE002/g,f=document.createDocumentFragment();let m,last=0;
while((m=rx.exec(tx))){if(m.index>last)f.appendChild(document.createTextNode(tx.slice(last,m.index).replace(MK,'')));const s=document.createElement('span');s.className='ep';s.setAttribute('contenteditable',CE);s.dataset.ep=m[1];s.textContent=m[2];f.appendChild(s);last=rx.lastIndex}
if(last<tx.length)f.appendChild(document.createTextNode(tx.slice(last).replace(MK,'')));n.replaceWith(f)})});
const app=$('app');
app.querySelectorAll('details').forEach(d=>d.open=true);
app.querySelectorAll('.hero[data-io]').forEach(h=>{const b=document.createElement('button');b.className='iob';b.dataset.ioid=h.dataset.io;b.textContent='Change background photo';h.appendChild(b)});
const lastOf=new Map();
app.querySelectorAll('.card,details,.blk').forEach(c=>{let hit=null;const isb=c.classList.contains('blk');if(!isb&&c.closest('.blk'))return;if(isb)hit=BKR[+c.dataset.bk]||null;
if(!hit)for(const ep of c.querySelectorAll('.ep')){const g=TAGS[+ep.dataset.ep];let o=g&&g.o;while(o&&!ARR.has(o))o=OWN.get(o);if(!o)continue;const arr=ARR.get(o),nm=ANM.get(arr);if(nm=='branches')continue;hit={it:o,arr};break}
if(!hit)return;if(hit.it&&typeof hit.it==='object'&&!EBASE.has(hit.it))EBASE.set(hit.it,cl(hit.it));const id=EDITM.push(hit)-1;
const d=document.createElement('div');d.className='ictl';d.innerHTML=['up|↑|Move earlier','dn|↓|Move later','dup|⧉|Duplicate','del|✕|Remove','rst|↶|Discard changes in this section only'].map(x=>{x=x.split('|');return`<button type="button" data-ic="${x[0]}" data-it="${id}" title="${x[2]}">${x[1]}</button>`}).join('');c.appendChild(d);if(!isb)lastOf.set(c.parentElement,{c,id})});
lastOf.forEach(v=>{const b=document.createElement('button');b.type='button';b.className='eadd';b.dataset.ic='add';b.dataset.it=v.id;b.textContent='+ Add another';v.c.insertAdjacentElement('afterend',b)})}
document.addEventListener('click',e=>{const t=e.target;if(!t.closest)return;
const a=t.closest('[data-ea]');if(a){e.preventDefault();e.stopPropagation();edAct(a.dataset.ea);return}
if(!edOn())return;
const c=t.closest('[data-ic]');if(c){e.preventDefault();e.stopPropagation();edItem(c);return}
const ab=t.closest('[data-ab]');if(ab){e.preventDefault();e.stopPropagation();edAddBlock(ab.dataset.ab);return}
const bo=t.closest('[data-bo]');if(bo){e.preventDefault();e.stopPropagation();edBlockOpt(bo);return}
const fo=t.closest('[data-fo]');if(fo){e.preventDefault();e.stopPropagation();const r=FOR[+fo.dataset.fo];if(r)pickFile(DOCS,MAXF,async f=>{r.o[r.k]=await Media.put(f,f.name);r.o[r.k+'Name']=f.name;edDirty();edRedraw()});return}
const io=t.closest('[data-io]'),ib=t.closest('[data-ioid]');
if(ib||(io&&!io.classList.contains('hero'))){e.preventDefault();e.stopPropagation();edPick(ib?ib.dataset.ioid:io.dataset.io,e.altKey);return}
if(t.closest('summary')){e.preventDefault();return}
const l=t.closest('a');if(l&&l.querySelector('.ep'))e.preventDefault()},true);
document.addEventListener('input',e=>{const t=e.target;if(!edOn()||!t.classList||!t.classList.contains('ep'))return;const g=TAGS[+t.dataset.ep];if(!g)return;
edSet(g,t.textContent.replace(/\u00a0/g,' '));edDirty();
document.querySelectorAll('.ep').forEach(x=>{if(x===t)return;const h=TAGS[+x.dataset.ep];if(h&&h.o===g.o&&h.k===g.k&&h.line===g.line)x.textContent=t.textContent})});
document.addEventListener('focusout',e=>{const t=e.target;if(!edOn()||!t.classList||!t.classList.contains('ep')||t.textContent.trim())return;const g=TAGS[+t.dataset.ep];if(!g)return;const d=Array.isArray(g.o)?'-':g.k=='cap'?' ':g.k=='banner'?'':'[EDIT: type here]';t.textContent=d;edSet(g,d)});
document.addEventListener('paste',e=>{const t=e.target;if(!edOn()||!t.classList||!t.classList.contains('ep'))return;e.preventDefault();document.execCommand('insertText',false,(e.clipboardData.getData('text/plain')||'').replace(/\s*\n\s*/g,' '))});
document.addEventListener('keydown',e=>{if(!edOn())return;const t=e.target;if(t.classList&&t.classList.contains('ep')&&(e.key=='Enter'||e.key=='Escape')){e.preventDefault();t.blur()}
if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()=='s'){e.preventDefault();edSave()}});
document.addEventListener('keyup',e=>{if(edOn()&&e.key==' '&&e.target.closest&&e.target.closest('summary'))e.preventDefault()});
window.addEventListener('beforeunload',e=>{if(EDIT&&DIRTY){e.preventDefault();e.returnValue=''}});
function curKey(){return location.hash.slice(1)||'home'}
function edAddBlock(type){const k=curKey();D.blocks=D.blocks||{};
const push=b=>{(D.blocks[k]=D.blocks[k]||[]).push(b);edDirty();edRedraw();setTimeout(()=>{const x=document.querySelectorAll('.blk');if(x.length)x[x.length-1].scrollIntoView({block:'center'})},120)};
const T={heading:{type:'heading',title:'[EDIT: heading]'},text:{type:'text',body:'[EDIT: write your text here]'},button:{type:'button',title:'[EDIT: button label]',url:'#contact'},table:{type:'table',rows:[{cells:['Column 1','Column 2','Column 3']},{cells:['Text','Text','Text']},{cells:['Text','Text','Text']}]}};
if(T[type])return push(T[type]);
if(type=='image')pickFile('image/*',25*1048576,async f=>push({type:'image',img:await putImage(f),cap:' '}));
if(type=='video')pickFile('video/*',MAXF,async f=>push({type:'video',src:await Media.put(f,f.name),url:'',cap:' '}));
if(type=='file')pickFile(DOCS,MAXF,async f=>push({type:'file',title:f.name.replace(/\.[^.]+$/,''),desc:'[EDIT: short description]',file:await Media.put(f,f.name),fname:f.name,size:f.size}))}
function edBlockOpt(btn){const w=btn.closest('.blk'),r=BKR[+w.dataset.bk];if(!r)return;const b=r.it,k=btn.dataset.bo,done=()=>{edDirty();edRedraw()};
if(k=='link'){const u=prompt('Where should the button go? (https://..., mailto:..., tel:... or #page-name)',b.url||'');if(u!==null){b.url=u.trim();done()}return}
if(k=='vurl'){const u=prompt('Paste a YouTube, Vimeo or direct video link (leave empty to use the uploaded video):',b.url||'');if(u!==null){b.url=u.trim();done()}return}
if(k=='rep'){if(b.type=='video')pickFile('video/*',MAXF,async f=>{b.src=await Media.put(f,f.name);b.url='';done()});else pickFile(DOCS,MAXF,async f=>{b.file=await Media.put(f,f.name);b.fname=f.name;b.size=f.size;done()});return}
const rows=b.rows;if(!rows)return;
if(k=='tr+')rows.push({cells:rows[0].cells.map(()=>'Text')});
else if(k=='tr-'){if(rows.length>1)rows.pop()}
else if(k=='tc+')rows.forEach(x=>x.cells.push('Text'));
else if(k=='tc-'){if(rows[0].cells.length>1)rows.forEach(x=>x.cells.pop())}
done()}
async function exportSite(){edStat('Preparing file...');try{const media=await Media.pack(refIds());const c=document.documentElement.cloneNode(true);
['pv','lg','nav','app','ft'].forEach(id=>{const e=c.querySelector('#'+id);if(e)e.innerHTML=''});
c.querySelectorAll('#edbar,.lb,link[rel=icon],script[data-seed]').forEach(e=>e.remove());
['style','class','data-theme','data-btn','data-card','data-bgs','data-nav'].forEach(a=>c.removeAttribute(a));
const bd=c.querySelector('body');bd.removeAttribute('class');bd.removeAttribute('style');
const js=JSON.stringify({content:D,media}).replace(/</g,'\\u003c').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');
const s=document.createElement('script');s.setAttribute('data-seed','1');s.textContent='window.__SEED='+js+';';bd.insertBefore(s,bd.firstChild);
dl(new Blob(['<!DOCTYPE html>\n'+c.outerHTML],{type:'text/html'}),'index.html');edStat('Exported: upload index.html to your web host')}catch(e){alert('Could not prepare the file: '+e.message)}}

let GCAT='';
function gUpBar(cats){return `<div class="gup" id="gdrop"><b>Add your photos<br><span class="muted" style="font-weight:400">Choose many at once, or drop them here. They go into the category you pick. Then press Save.</span></b><select id="gsel" aria-label="Category for new photos">${cats.map(c=>`<option ${c==GCAT?'selected':''}>${esc(c)}</option>`).join('')}</select><button type="button" class="big" data-gup="1">＋ Add photos</button></div>`}
async function gAdd(files){files=[...files].filter(f=>/^image\//.test(f.type));if(!files.length){alert('Please choose photos (JPG, PNG or WebP).');return}
const cat=($('gsel')&&$('gsel').value)||GCAT||'';let n=0;
for(const f of files){edStat('Adding photo '+(n+1)+' of '+files.length+'...');try{const u=await putImage(f);D.gallery.push({cat:cat,img:u,cap:' '});n++}catch(e){}}
if(n){edDirty();edRedraw();setTimeout(()=>edStat(n+(n>1?' photos added':' photo added')+'. Press Save to keep them.'),80)}else edStat('')}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-gup]');if(!b||!edOn())return;e.preventDefault();const f=document.createElement('input');f.type='file';f.accept='image/*';f.multiple=true;f.onchange=()=>{if(f.files.length)gAdd(f.files)};f.click()},true);
document.addEventListener('change',e=>{const t=e.target;if(!t.dataset||!edOn())return;if(t.id=='gsel')GCAT=t.value;else if(t.dataset.gsel!==undefined&&D.gallery[+t.dataset.gsel]){D.gallery[+t.dataset.gsel].cat=t.value;edDirty();edRedraw()}});
['dragover','dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{const z=e.target.closest&&e.target.closest('#gdrop');if(!z||!edOn())return;e.preventDefault();if(ev=='dragover')z.classList.add('over');else{z.classList.remove('over');if(ev=='drop'&&e.dataTransfer&&e.dataTransfer.files.length)gAdd(e.dataTransfer.files)}}));
function openLb(start){const ims=[...document.querySelectorAll('#gal .gi')].filter(c=>c.style.display!='none').map(c=>c.querySelector('img')).filter(Boolean);if(!ims.length)return;let i=Math.max(0,ims.indexOf(start));
const d=document.createElement('div');d.className='lb';d.setAttribute('role','dialog');d.setAttribute('aria-label','Photo viewer');
d.innerHTML='<button type="button" class="lbx" aria-label="Close">✕</button>'+(ims.length>1?'<button type="button" class="lbp" aria-label="Previous photo">‹</button><button type="button" class="lbn" aria-label="Next photo">›</button>':'')+'<img alt=""><div class="lbc"></div>';
const im=d.querySelector('img'),cp=d.querySelector('.lbc');
const show=n=>{i=(n+ims.length)%ims.length;im.src=ims[i].currentSrc||ims[i].src;im.alt=ims[i].alt;cp.textContent=(ims[i].alt||'').trim()+(ims.length>1?'  ('+(i+1)+' of '+ims.length+')':'')};
const key=e=>{if(e.key=='Escape')close();else if(e.key=='ArrowRight')show(i+1);else if(e.key=='ArrowLeft')show(i-1)};
const close=()=>{d.remove();document.removeEventListener('keydown',key)};
d.onclick=e=>{if(e.target.closest('.lbx')||e.target==d)close();else if(e.target.closest('.lbp'))show(i-1);else if(e.target.closest('.lbn'))show(i+1)};
let x0=null;d.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});d.addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>50)show(i+(dx<0?1:-1))});
document.addEventListener('keydown',key);show(i);document.body.appendChild(d)}
Media.open().then(()=>Media.all()).then(()=>Media.seed()).then(()=>render(),()=>render());
