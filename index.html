const p=await fetch(api,{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},hd),body:JSON.stringify({message:'Website update '+new Date().toISOString(),content:b64,branch:c.branch,sha:sha})});
if(!p.ok){let m='';try{m=(await p.json()).message}catch(e){}throw new Error('GitHub answered '+p.status+(m?': '+m:''))}
edStat('Live website updated. Everyone sees it in about a minute.');setTimeout(()=>{if(!CBUSY)edStat()},6000)}catch(e){edStat('Live update failed: '+e.message)}
CBUSY=false;if(CAGAIN){CAGAIN=false;cloudQueue()}}
async function publishSite(){if(DIRTY&&!edSave())return;await exportSite();alert('Your website file has been prepared with your uploaded photos and videos. To make the changes visible to everyone, upload the downloaded index.html to the root of your GitHub repository and replace the old file. Cloudflare Pages will redeploy it.');}
async function exportSite(auto){edStat('Preparing your photos and website...');try{await Media.all();const ids=refIds();const media=await Media.pack(ids);const missing=ids.filter(id=>!media[id]);if(missing.length)throw new Error('Some uploaded photos are missing from this browser. Please upload those photos again before publishing.');const c=document.documentElement.cloneNode(true);
['pv','lg','nav','app','ft'].forEach(id=>{const e=c.querySelector('#'+id);if(e)e.innerHTML=''});
c.querySelectorAll('#edbar,.lb,link[rel=icon],script[data-seed]').forEach(e=>e.remove());
['style','class','data-theme','data-btn','data-card','data-bgs','data-nav'].forEach(a=>c.removeAttribute(a));
const bd=c.querySelector('body');bd.removeAttribute('class');bd.removeAttribute('style');
const js=JSON.stringify({content:D,media}).replace(/</g,'\\u003c').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');
const s=document.createElement('script');s.setAttribute('data-seed','1');s.textContent='window.__SEED='+js+';';bd.insertBefore(s,bd.firstChild);
const html='<!DOCTYPE html>\n'+c.outerHTML;if(auto)return html;dl(new Blob([html],{type:'text/html'}),'index.html');edStat('Ready: index.html includes your uploaded photos')}catch(e){if(auto)throw e;alert('Could not prepare the file: '+e.message)}}

let GCAT='';
function gVid(g){const e=vEmb(g.vurl),v=mu(g.vid);return e&&e[0]=='i'?`<iframe class="vid" src="${esc(e[1])}" title="${esc(g.cap||'Video')}" allowfullscreen loading="lazy"></iframe>`:e?`<video class="vid" controls preload="metadata" playsinline src="${esc(e[1])}"></video>`:v?`<video class="vid" controls preload="metadata" playsinline src="${esc(v)}"></video>`:'<div class="ph vid">Video missing. Remove it and add it again.</div>'}
function gUpBar(cats){return `<div class="gup" id="gdrop"><b>Add your photos and videos<br><span class="muted" style="font-weight:400">Choose many at once, or drop them here. They go into the category you pick. They save by themselves.</span></b><select id="gsel" aria-label="Category for new photos">${cats.map(c=>`<option ${c==GCAT?'selected':''}>${esc(c)}</option>`).join('')}</select><button type="button" class="big" data-gup="1">＋ Add photos</button><button type="button" class="big" data-gvup="1">＋ Add videos</button><button type="button" class="big" data-gvlink="1">＋ Video link (YouTube)</button></div>`}
async function gAdd(files){files=[...files].filter(f=>/^(image|video)\//.test(f.type));if(!files.length){alert('Please choose photos (JPG, PNG, WebP) or videos (MP4, WebM).');return}
const cat=($('gsel')&&$('gsel').value)||GCAT||'';let n=0;
let big=0;for(const f of files){edStat('Adding '+(n+1)+' of '+files.length+'...');try{if(/^video\//.test(f.type)){if(f.size>MAXF){big++;continue}const u=await Media.put(f,f.name);D.gallery.push({cat:cat,vid:u,vurl:'',cap:' '})}else{const u=await putImage(f);D.gallery.push({cat:cat,img:u,cap:' '})}n++}catch(e){}}if(big)alert(big+' video(s) were bigger than 25 MB and were skipped. For long videos, upload to YouTube and use the Video link button.');
if(n){edDirty();edRedraw();setTimeout(()=>edStat(n+(n>1?' items added':' item added')+'. Press Save to keep them.'),80)}else edStat('')}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-gup]');if(!b||!edOn())return;e.preventDefault();const f=document.createElement('input');f.type='file';f.accept='image/*';f.multiple=true;f.onchange=()=>{if(f.files.length)gAdd(f.files)};f.click()},true);
document.addEventListener('click',e=>{if(!edOn())return;const t=e.target.closest&&e.target.closest('[data-gvup],[data-gvlink],[data-gvdel]');if(!t)return;e.preventDefault();e.stopPropagation();
if(t.dataset.gvup){const f=document.createElement('input');f.type='file';f.accept='video/*';f.multiple=true;f.onchange=()=>{if(f.files.length)gAdd(f.files)};f.click()}
else if(t.dataset.gvlink){const u=prompt('Paste a YouTube, Vimeo or direct video link:','');if(u&&vEmb(u.trim())){const cat=($('gsel')&&$('gsel').value)||GCAT||'';D.gallery.push({cat:cat,vid:'',vurl:u.trim(),cap:' '});edDirty();edRedraw()}else if(u)alert('That does not look like a video link. It must start with https://')}
else if(t.dataset.gvdel!==undefined){if(confirm('Remove this video from the gallery?')){D.gallery.splice(+t.dataset.gvdel,1);edDirty();edRedraw()}}},true);
document.addEventListener('change',e=>{const t=e.target;if(!t.dataset||!edOn())return;if(t.id=='gsel')GCAT=t.value;else if(t.dataset.gsel!==undefined&&D.gallery[+t.dataset.gsel]){D.gallery[+t.dataset.gsel].cat=t.value;edDirty();edRedraw()}});
['dragover','dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{const z=e.target.closest&&e.target.closest('#gdrop');if(!z||!edOn())return;e.preventDefault();if(ev=='dragover')z.classList.add('over');else{z.classList.remove('over');if(ev=='drop'&&e.dataTransfer&&e.dataTransfer.files.length)gAdd(e.dataTransfer.files)}}));
function openLb(start){const ims=[...document.querySelectorAll('#gal .gi')].filter(c=>c.style.display!='none').map(c=>c.querySelector('img')).filter(Boolean);if(!ims.length)return;let i=Math.max(0,ims.indexOf(start));
const d=document.createElement('div');d.className='lb';d.setAttribute('role','dialog');d.setAttribute('aria-label','Photo viewer');
d.innerHTML='<button type="button" class="lbx" aria-label="Close">✕</button>'+(ims.length>1?'<button type="button" class="lbp" aria-label="Previous photo">‹</button><button type="button" class="lbn" aria-label="Next photo">›</button>':'')+'<img alt=""><div class="lbc"></div>';
const im=d.querySelector('img'),cp=d.querySelector('.lbc');
const show=n=>{i=(n+ims.length)%ims.length;im.src=ims[i].currentSrc||ims[i].src;im.alt=ims[i].alt;cp.textContent=(ims[i].alt||'').trim()+(ims.length>1?'  ('+(i+1)+' of '+ims.length+')':'')};
const key=e=>{if(e.key=='Escape')close();else if(e.key=='ArrowRight')show(i+1);else if(e.key=='ArrowLeft')show(i-1)};
const close=()=>{d.remove();document.removeEventListener('keydown',key)};
d.onclick=e=>{if(e.target.closest('.lbx')||e.target==d)close();else if(e.target.closest('.lbp'))show(i-1);else if(e.target.closest('.lbn'))show(i+1)};
let x0=null;d.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});d.addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>50)show(i+(dx<0?1:-1))});
document.addEventListener('keydown',key);show(i);document.body.appendChild(d)}
Media.open().then(()=>Media.all()).then(()=>Media.seed()).then(()=>render(),()=>render());
